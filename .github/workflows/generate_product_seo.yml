name: Generate Product SEO

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'ID Produk yang akan dianalisis'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r seo-engine/requirements.txt

      - name: Run SEO Analysis
        env:
          LARAVEL_API_URL: ${{ secrets.LARAVEL_API_URL }}
          SEO_API_TOKEN: ${{ secrets.SEO_API_TOKEN }}
        run: |
          python seo-engine/main.py analyze-product ${{ github.event.inputs.product_id }} --save
